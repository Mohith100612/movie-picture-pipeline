name: Frontend CD

"on":
  push:
    branches:
      - main
    paths:
      - starter/frontend/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-staging
  cancel-in-progress: false

env:
  NODE_VERSION: "18.14"
  AWS_REGION: ${{ secrets.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
  ECR_REPOSITORY: ${{ secrets.FRONTEND_ECR_REPOSITORY }}
  REACT_APP_MOVIE_API_URL: ${{ vars.REACT_APP_MOVIE_API_URL }}

defaults:
  run:
    working-directory: starter/frontend

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
        env:
          CI: "true"

  build:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - lint
      - test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate deployment configuration
        run: |
          : "${AWS_REGION:?Set the AWS_REGION repository secret}"
          : "${ECR_REPOSITORY:?Set the FRONTEND_ECR_REPOSITORY repository secret to the full ECR URL}"
          : "${EKS_CLUSTER_NAME:?Set the EKS_CLUSTER_NAME repository secret}"
          : "${REACT_APP_MOVIE_API_URL:?Set the REACT_APP_MOVIE_API_URL repository variable}"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push frontend image
        run: |
          IMAGE="${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker build --build-arg REACT_APP_MOVIE_API_URL="${REACT_APP_MOVIE_API_URL}" --tag "${IMAGE}" .
          docker push "${IMAGE}"

  deploy:
    name: Deploy to Amazon EKS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2
      - name: Update EKS kubeconfig
        run: aws eks update-kubeconfig --name "${EKS_CLUSTER_NAME}" --region "${AWS_REGION}"
      - name: Apply frontend manifests
        working-directory: starter/frontend/k8s
        run: |
          kustomize edit set image frontend="${ECR_REPOSITORY}:${GITHUB_SHA}"
          kustomize build | kubectl apply -f -
          kubectl rollout status deployment/frontend --timeout=180s
      - name: Collect deployment diagnostics
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe deployment/frontend || true
          kubectl logs deployment/frontend --tail=100 || true
      - name: Write deployment summary
        if: always()
        run: |
          printf '### frontend staging deployment\nStatus: %s\nCommit: %s\n' "${{ job.status }}" "${GITHUB_SHA}" >> "${GITHUB_STEP_SUMMARY}"

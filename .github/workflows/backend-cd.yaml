name: Backend Continuous Deployment

"on":
  push:
    branches:
      - main
    paths:
      - starter/backend/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-staging
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.10"
  AWS_REGION: ${{ secrets.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
  ECR_REPOSITORY: ${{ secrets.BACKEND_ECR_REPOSITORY }}

defaults:
  run:
    working-directory: starter/backend

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Pipenv
        run: python -m pip install pipenv
      - name: Install dependencies
        run: pipenv install --dev --deploy
      - name: Run Flake8
        run: pipenv run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Pipenv
        run: python -m pip install pipenv
      - name: Install dependencies
        run: pipenv install --dev --deploy
      - name: Run tests
        run: pipenv run test

  build:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - lint
      - test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate deployment configuration
        run: |
          : "${AWS_REGION:?Set the AWS_REGION repository secret}"
          : "${ECR_REPOSITORY:?Set the BACKEND_ECR_REPOSITORY repository secret to the full ECR URL}"
          : "${EKS_CLUSTER_NAME:?Set the EKS_CLUSTER_NAME repository secret}"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push backend image
        run: |
          IMAGE="${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker build --tag "${IMAGE}" .
          docker push "${IMAGE}"

  deploy:
    name: Deploy to Amazon EKS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2
      - name: Update EKS kubeconfig
        run: aws eks update-kubeconfig --name "${EKS_CLUSTER_NAME}" --region "${AWS_REGION}"
      - name: Apply backend manifests
        working-directory: starter/backend/k8s
        run: |
          kustomize edit set image backend="${ECR_REPOSITORY}:${GITHUB_SHA}"
          kustomize build | kubectl apply -f -
          kubectl rollout status deployment/backend --timeout=180s
      - name: Verify Kubernetes deployment
        run: |
          kubectl rollout status deployment/backend --timeout=180s
          kubectl get all
          kubectl describe deployment backend
          EXPECTED_IMAGE="${ECR_REPOSITORY}:${GITHUB_SHA}"
          ACTUAL_IMAGE=$(kubectl get deployment backend -o jsonpath='{.spec.template.spec.containers[0].image}')
          test "${ACTUAL_IMAGE}" = "${EXPECTED_IMAGE}"
      - name: Verify Backend ECR image
        env:
          AWS_PAGER: ""
        run: |
          aws ecr describe-images --region "${AWS_REGION}" \
            --repository-name "${ECR_REPOSITORY#*/}" \
            --image-ids "imageTag=${GITHUB_SHA}"
      - name: Collect deployment diagnostics
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe deployment/backend || true
          kubectl logs deployment/backend --tail=100 || true
      - name: Write deployment summary
        if: always()
        run: |
          printf '### backend staging deployment\nStatus: %s\nCommit: %s\n' "${{ job.status }}" "${GITHUB_SHA}" >> "${GITHUB_STEP_SUMMARY}"

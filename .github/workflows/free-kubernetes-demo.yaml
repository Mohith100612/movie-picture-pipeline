name: Free Kubernetes Demo

"on":
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - starter/**
      - .github/workflows/free-kubernetes-demo.yaml
      - demo/**
  push:
    branches: [main]
    paths:
      - starter/**
      - .github/workflows/free-kubernetes-demo.yaml
      - demo/**

permissions:
  contents: read

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: starter/frontend/.nvmrc
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json
      - run: npm ci
        working-directory: starter/frontend
      - run: npm run lint
        working-directory: starter/frontend
      - run: npm test -- --watchAll=false --runInBand
        working-directory: starter/frontend
        env:
          CI: "true"

  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install pipenv
      - run: pipenv install --dev --deploy
        working-directory: starter/backend
      - run: pipenv run lint
        working-directory: starter/backend
      - run: pipenv run test
        working-directory: starter/backend

  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [frontend-checks, backend-checks]
    steps:
      - uses: actions/checkout@v4
      - name: Build SHA-tagged Docker images
        run: |
          docker build -t mp-backend:${GITHUB_SHA} starter/backend
          docker build --build-arg REACT_APP_MOVIE_API_URL=http://127.0.0.1:5000 -t mp-frontend:${GITHUB_SHA} starter/frontend
      - name: Install Kind and create temporary cluster
        run: |
          curl --fail --location https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64 -o /tmp/kind
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
          kind create cluster --name movie-demo --wait 120s
          kind load docker-image mp-backend:${GITHUB_SHA} mp-frontend:${GITHUB_SHA} --name movie-demo
      - name: Deploy existing Kubernetes manifests
        run: |
          for APP in backend frontend; do
            kubectl kustomize "starter/${APP}/k8s" > "/tmp/${APP}.yaml"
            sed -i "s|image: ${APP}$|image: mp-${APP}:${GITHUB_SHA}|" "/tmp/${APP}.yaml"
            kubectl apply -f "/tmp/${APP}.yaml"
          done
          kubectl rollout status deployment/backend --timeout=180s
          kubectl rollout status deployment/frontend --timeout=180s
          mkdir -p demo-evidence
          kubectl get deployments,pods,services -o wide > demo-evidence/kubernetes.txt
          kubectl get deployments -o json > demo-evidence/deployments.json
      - name: Expose applications within the runner
        run: |
          kubectl port-forward service/backend 5000:80 > /tmp/backend-forward.log 2>&1 &
          kubectl port-forward service/frontend 3000:80 > /tmp/frontend-forward.log 2>&1 &
          curl --retry 20 --retry-connrefused --retry-delay 2 --fail http://127.0.0.1:5000/movies/ -o demo-evidence/movies.json
          curl --retry 20 --retry-connrefused --retry-delay 2 --fail http://127.0.0.1:3000/ -o demo-evidence/frontend.html
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify frontend displays movies and capture screenshot
        working-directory: demo
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
          node verify.cjs
      - name: Capture diagnostics
        if: failure()
        run: |
          mkdir -p demo-evidence
          kubectl get pods -o wide > demo-evidence/pods.txt 2>&1 || true
          kubectl describe pods > demo-evidence/describe.txt 2>&1 || true
          kubectl logs deployment/backend > demo-evidence/backend.log 2>&1 || true
          kubectl logs deployment/frontend > demo-evidence/frontend.log 2>&1 || true
      - name: Upload demonstration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-kubernetes-demo-${{ github.sha }}
          path: demo-evidence/
          retention-days: 7
      - name: Remove temporary cluster
        if: always()
        run: |
          if command -v kind >/dev/null 2>&1; then
            kind delete cluster --name movie-demo
          fi

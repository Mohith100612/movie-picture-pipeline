name: Backend CI

"on":
  pull_request:
    branches:
      - main
    paths:
      - starter/backend/**
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.10"

defaults:
  run:
    working-directory: starter/backend

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Pipenv
        run: python -m pip install pipenv
      - name: Install dependencies
        run: pipenv install --dev --deploy
      - name: Run Flake8
        run: pipenv run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Pipenv
        run: python -m pip install pipenv
      - name: Install dependencies
        run: pipenv install --dev --deploy
      - name: Run tests
        run: pipenv run test

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build backend image
        run: docker build --tag mp-backend:${{ github.sha }} .
